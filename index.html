<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Game</title>
    
    <!-- Menggunakan font Rajdhani yang memberikan nuansa modern/futuristik khas gaming -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS untuk layouting responsif -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --color-fantasy: #dc2626; /* Merah untuk Dark Fantasy */
            --color-indie: #0ea5e9;   /* Biru cerah untuk Indie Game */
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #050505;
            color: #ffffff;
            margin: 0;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(220, 38, 38, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(14, 165, 233, 0.05), transparent 25%);
        }

        /* Latar belakang partikel/garis halus (opsional untuk menambah estetik) */
        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            z-index: -1;
            mask-image: linear-gradient(to bottom, transparent, black, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black, transparent);
        }

        /* Animasi masuk awal */
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Styling Kartu Game */
        .game-card {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Garis kilauan di atas kartu */
        .game-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        /* Efek Hover Spesifik */
        .card-fantasy:hover {
            transform: translateY(-12px) scale(1.03);
            border-color: var(--color-fantasy);
            box-shadow: 0 10px 40px -10px rgba(220, 38, 38, 0.7),
                        inset 0 0 20px -5px rgba(220, 38, 38, 0.3);
        }
        .card-fantasy:hover::before { background: linear-gradient(90deg, transparent, var(--color-fantasy), transparent); opacity: 1; }
        .card-fantasy:hover .icon-wrapper svg { color: var(--color-fantasy); filter: drop-shadow(0 0 8px var(--color-fantasy)); }

        .card-indie:hover {
            transform: translateY(-12px) scale(1.03);
            border-color: var(--color-indie);
            box-shadow: 0 10px 40px -10px rgba(14, 165, 233, 0.7),
                        inset 0 0 20px -5px rgba(14, 165, 233, 0.3);
        }
        .card-indie:hover::before { background: linear-gradient(90deg, transparent, var(--color-indie), transparent); opacity: 1; }
        .card-indie:hover .icon-wrapper svg { color: var(--color-indie); filter: drop-shadow(0 0 8px var(--color-indie)); }

        /* Icon Wrapper & Transisi */
        .icon-wrapper {
            transition: all 0.4s ease;
        }
        .icon-wrapper svg {
            transition: all 0.4s ease;
            color: #888;
        }

        /* Animasi Klik JS */
        .clicked {
            animation: clickEffect 0.3s ease forwards !important;
        }

        @keyframes clickEffect {
            0% { transform: scale(1.03); }
            50% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 0; }
        }

    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
    
    <!-- Background hiasan -->
    <div class="bg-grid"></div>

    <!-- Header -->
    <header class="text-center mb-16 fade-in-up" style="animation-delay: 0.1s;">
        <h1 class="text-5xl md:text-6xl font-bold tracking-wider mb-3 text-transparent bg-clip-text bg-gradient-to-r from-gray-100 to-gray-500 uppercase">
            Pilih Game
        </h1>
        <p class="text-gray-400 text-lg md:text-xl tracking-wide">
            Tentukan takdir petualanganmu selanjutnya
        </p>
    </header>

    <!-- Kontainer Pilihan Game -->
    <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-8 lg:gap-12 fade-in-up" style="animation-delay: 0.3s;">
        
        <!-- Kartu Dark Fantasi -->
        <a href="./darkfantasi.html" class="game-card card-fantasy p-8 cursor-pointer group" onclick="handleCardClick(event, this, './darkfantasi.html')">
            <div class="icon-wrapper w-24 h-24 mb-6 flex items-center justify-center rounded-full bg-gray-800/50 group-hover:bg-red-900/20 border border-transparent group-hover:border-red-500/30">
                <!-- SVG Sword / Dark Fantasy Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path>
                    <path d="M13 19l6-6"></path>
                    <path d="M16 16l4 4"></path>
                    <path d="M19 21l2-2"></path>
                    <path d="M14.5 17.5L10 13"></path>
                    <path d="M17.5 14.5L13 10"></path>
                </svg>
            </div>
            <h2 class="text-3xl font-bold mb-3 tracking-wide text-gray-100 group-hover:text-white transition-colors duration-300">Dark Fantasi</h2>
            <p class="text-gray-400 text-center text-lg leading-relaxed group-hover:text-gray-300 transition-colors duration-300">
                Masuk ke dalam dunia kegelapan, penuh monster mistis dan sihir kuno yang mematikan.
            </p>
            <div class="mt-8 px-6 py-2 rounded-full border border-gray-600 text-gray-400 text-sm tracking-widest uppercase group-hover:border-red-500 group-hover:text-red-400 transition-all duration-300">
                Mainkan Sekarang
            </div>
        </a>

        <!-- Kartu Indie Game -->
        <a href="./indiegame.html" class="game-card card-indie p-8 cursor-pointer group" onclick="handleCardClick(event, this, './indiegame.html')">
            <div class="icon-wrapper w-24 h-24 mb-6 flex items-center justify-center rounded-full bg-gray-800/50 group-hover:bg-sky-900/20 border border-transparent group-hover:border-sky-500/30">
                <!-- SVG Gamepad / Indie Game Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="6" width="20" height="12" rx="2"></rect>
                    <path d="M6 12h4"></path>
                    <path d="M8 10v4"></path>
                    <path d="M15 13h.01"></path>
                    <path d="M18 11h.01"></path>
                </svg>
            </div>
            <h2 class="text-3xl font-bold mb-3 tracking-wide text-gray-100 group-hover:text-white transition-colors duration-300">Indie Game</h2>
            <p class="text-gray-400 text-center text-lg leading-relaxed group-hover:text-gray-300 transition-colors duration-300">
                Eksplorasi mahakarya kreativitas tanpa batas dengan gaya seni unik dan cerita mendalam.
            </p>
            <div class="mt-8 px-6 py-2 rounded-full border border-gray-600 text-gray-400 text-sm tracking-widest uppercase group-hover:border-sky-400 group-hover:text-sky-400 transition-all duration-300">
                Mainkan Sekarang
            </div>
        </a>

    </div>

    <!-- Script untuk efek transisi saat di-klik -->
    <script>
        function handleCardClick(event, element, targetUrl) {
            // Mencegah navigasi langsung
            event.preventDefault();
            
            // Menambahkan class untuk animasi klik
            element.classList.add('clicked');
            
            // Efek suara atau logika lainnya bisa ditaruh di sini
            
            // Berpindah halaman setelah animasi selesai (300ms)
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 300);
        }
    </script>
</body>
</html>
